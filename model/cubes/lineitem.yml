cubes:
  - name: lineitem
    # sql_table: "\"TPCH_SF100\".\"LINEITEM\""
    sql: >
      SELECT *
      FROM SNOWFLAKE_SAMPLE_DATA.TPCH_SF100.LINEITEM
      WHERE L_LINESTATUS = 'O' AND L_RETURNFLAG = 'N'

    joins: 
      - name: orders    
        sql: "{CUBE.orderkey} = {orders.orderkey}"
        relationship: many_to_one
      - name: supplier
        sql: "{CUBE.suppkey} = {supplier.suppkey}"
        relationship: many_to_one
      - name: part
        sql: "{CUBE.partkey} = {part.partkey}"
        relationship: many_to_one

    dimensions:
## keys 
      - name: lineitemkey
        sql: "CONCAT({CUBE.orderkey},{CUBE.line_number})"
        type: string
        primary_key: true

      - name: orderkey
        sql: "{CUBE}.\"L_ORDERKEY\""
        type: number
        primary_key: true
      
      - name: suppkey
        sql: "{CUBE}.\"L_SUPPKEY\""
        type: number

      - name: partkey
        sql: "{CUBE}.\"L_PARTKEY\""
        type: number

## dates 
      - name: ship_date
        sql: "{CUBE}.\"L_SHIPDATE\""
        type: time

      - name: commit_date
        sql: "{CUBE}.\"L_COMMITDATE\""
        type: time

      - name: receipt_date
        sql: "{CUBE}.\"L_RECEIPTDATE\""
        type: time

## facts 
      - name: line_number
        sql: "{CUBE}.\"L_LINENUMBER\""
        type: number

      - name: quantity
        sql: "{CUBE}.\"L_QUANTITY\""
        type: number

      - name: extended_price
        sql: "{CUBE}.\"L_EXTENDEDPRICE\""
        type: number

      - name: discount
        sql: "{CUBE}.\"L_DISCOUNT\""
        type: number

      - name: tax
        sql: "{CUBE}.\"L_TAX\""
        type: number

## details 
      - name: return_flag
        sql: "{CUBE}.\"L_RETURNFLAG\""
        type: string

      - name: line_status
        sql: "{CUBE}.\"L_LINESTATUS\""
        type: string

      - name: ship_mode
        sql: "{CUBE}.\"L_SHIPMODE\""
        type: string

      - name: comment
        sql: "{CUBE}.\"L_COMMENT\""
        type: string

      - name: ship_instruct
        sql: "{CUBE}.\"L_SHIPINSTRUCT\""
        type: string

    measures:
      - name: count
        type: count
      
      - name: total_quantity        
        type: sum
        sql: "{CUBE.quantity}"
      
      - name: total_price
        type: sum
        sql: "{CUBE.extended_price}"
      
      - name: total_discount
        type: sum
        sql: "{CUBE.discount}"
      
      - name: total_tax
        type: sum
        sql: "{CUBE.tax}"
      
      - name: total_revenue
        type: number
        sql: "{CUBE.total_price} - {CUBE.total_discount}" 

      - name: total_profit
        type: number
        sql: "{CUBE.total_revenue} - {CUBE.total_tax}"
      
      - name: supplier_sales_contribution
        type: number
        sql: "{CUBE.extended_price} * (1 - {CUBE.discount})"
        
      - name: avg_item_price
        type: avg
        sql: "{CUBE.extended_price}"
        
      - name: avg_discount_rate
        type: avg
        sql: "{CUBE.discount}" 
      
      - name: avg_discounted_amount
        type: number
        sql: "{CUBE.total_discount} / {CUBE.count}" 

      - name: completed_count
        type: count
        filters:
          - sql: "{CUBE.orders.order_status} = 'O'"

      - name: completed_percentage
        type: number
        sql: "{CUBE.completed_count} / NULLIF({CUBE.count}, 0)"
        format: percent

    pre_aggregations:
      - name: item_rollup
        measures:
          - lineitem.total_discount
          - lineitem.total_quantity
          - lineitem.total_price
          - lineitem.total_tax
          - lineitem.completed_count
          - lineitem.count
        dimensions:
          - lineitem.ship_mode
          - lineitem.orders.customer.market_segment
          - lineitem.supplier.nation.nation_name
          - lineitem.supplier.nation.region.region_name
          # Rollupjoin
          - lineitem.partkey

        allow_non_strict_date_range_match: true
        time_dimension: ship_date
        granularity: month
        partition_granularity: year
        refresh_key:
          every: 365 day
        ## specifying a slice of data for testing
        build_range_start:
          sql: SELECT TO_TIMESTAMP('1994-01-01T00:00:00.000')
        build_range_end:
          sql: SELECT TO_TIMESTAMP('1998-12-31T23:59:59.999')
        indexes:
          - name: part_type
            columns:
              - lineitem.partkey

      - name: item_rollup_join
        type: rollup_join
        measures:
          - lineitem.total_discount
          - lineitem.total_quantity
          - lineitem.total_price
          - lineitem.total_tax
          - lineitem.completed_count
          - lineitem.count
        dimensions:
          - lineitem.ship_mode
          - lineitem.orders.customer.market_segment
          - lineitem.supplier.nation.nation_name
          - lineitem.supplier.nation.region.region_name
          - lineitem.part.part_name
          - lineitem.part.part_brand
          - lineitem.part.manufacturer
        rollups:
          - part.part_rollup
          - CUBE.item_rollup

